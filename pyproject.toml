[tool.ruff.lint.flake8-import-conventions.extend-aliases]
voluptuous = "vol"

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"async_timeout".msg = "use asyncio.timeout instead"
"pytz".msg = "use zoneinfo instead"
"tests".msg = "You should not import tests"
"__future__.annotations".msg = "not needed on Python 3.14+ (PEP 649)"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "tests"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PTH"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Pylint configuration: only used for the optional HA Core plugin checks
# (enforce_runtime_data, exception_translations, logger format, ...). Set
# HA_CORE to a checkout of github.com/home-assistant/core, then run:
#   uv run --with "pylint>=4" pylint custom_components/xenia_home/
# Ruff covers the standard lints; this is a strict superset.

[tool.pylint.MAIN]
py-version = "3.14"
jobs = 1
init-hook = "import os, sys; sys.path.extend([os.path.join(os.environ.get('HA_CORE', ''), 'pylint/plugins'), os.getcwd()])"
load-plugins = [
  "pylint.extensions.code_style",
  "pylint.extensions.typing",
  "pylint_home_assistant",
]
persistent = false

[tool.pylint.BASIC]
class-const-naming-style = "any"

