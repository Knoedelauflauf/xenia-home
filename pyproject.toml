[tool.ruff.lint.flake8-import-conventions.banned-aliases]
"probatio" = ["vol"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"async_timeout".msg = "use asyncio.timeout instead"
"pytz".msg = "use zoneinfo instead"
"tests".msg = "You should not import tests"
"voluptuous".msg = "use probatio instead"
"httpx".msg = "use httpx2 instead"
"httpcore".msg = "use httpcore2 instead"
"homeassistant.helpers.config_validation.ensure_list".msg = "use probatio.EnsureList() instead"
"homeassistant.helpers.config_validation.port".msg = "use probatio.Port() instead"
"homeassistant.helpers.config_validation.has_at_least_one_key".msg = "use probatio.AtLeastOne instead"
"homeassistant.helpers.config_validation.has_at_most_one_key".msg = "use probatio.AtMostOne instead"
"__future__.annotations".msg = "It should not be needed because Home Assistant requires Python 3.14+"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PTH"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pydocstyle]
convention = "google"
property-decorators = ["propcache.api.cached_property"]

# Pylint configuration: only used for the optional HA Core plugin checks
# (enforce_runtime_data, exception_translations, logger format, ...). Set
# HA_CORE to a checkout of github.com/home-assistant/core, then run:
#   uv run --with "pylint>=4" pylint custom_components/xenia_home/
# Ruff covers the standard lints; this is a strict superset.

[tool.pylint.MAIN]
py-version = "3.14"
jobs = 1
init-hook = "import os, sys; core = os.environ.get('HA_CORE', ''); sys.path.extend([os.path.join(core, 'packages/pylint-home-assistant'), os.path.join(core, 'pylint/plugins'), os.getcwd()])"
load-plugins = [
  "pylint.extensions.code_style",
  "pylint.extensions.typing",
  "pylint_home_assistant",
]
persistent = false

[tool.pylint.BASIC]
class-const-naming-style = "any"

[tool.pylint."MESSAGES CONTROL"]
