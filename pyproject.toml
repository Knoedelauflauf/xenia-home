[project]
name = "xenia-home"
version = "0.5.0"
description = "Home Assistant custom integration for Xenia espresso machines"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
    "homeassistant>=2026.5",
    "aioresponses>=0.7.8",
    "mypy>=1.19",
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
    "pytest-homeassistant-custom-component>=0.13",
    "ruff>=0.15",
    "syrupy>=4.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["custom_components/xenia_home"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
fail_under = 90

# Ruff configuration mirrors home-assistant/core. Only HA-internal aliases
# (PLATFORM_SCHEMA, helper-module shortenings) have been dropped because this
# integration does not import those.

[tool.ruff]
required-version = ">=0.15.13"

