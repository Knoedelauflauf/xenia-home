rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage:
    status: todo
    comment: "Explicit coverage report verifying all config-flow paths is not yet produced."
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: todo
    comment: "Audit pending: confirm all action handlers raise ServiceValidationError or HomeAssistantError as appropriate."
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: "Local device with no authentication; no credentials to refresh."
  test-coverage:
    status: todo
    comment: "Explicit pytest --cov verification against the 95% threshold is not yet produced."

  # Gold
  devices: done
  diagnostics:
    status: todo
    comment: "No diagnostics.py module yet."
  discovery:
    status: exempt
    comment: "Xenia machines have no documented discovery protocol; host is entered manually."
  discovery-update-info:
    status: exempt
    comment: "Same reason as discovery."
  docs-data-update:
    status: todo
    comment: "README does not yet document the data update strategy."
  docs-examples:
    status: todo
    comment: "README does not yet contain example automations."
  docs-known-limitations:
    status: todo
    comment: "README does not yet contain a known-limitations section."
  docs-supported-devices:
    status: todo
    comment: "README mentions DBL with API v2; a full supported-devices section is not yet written."
  docs-supported-functions:
    status: todo
    comment: "README does not yet contain a dedicated supported-functions section."
  docs-troubleshooting:
    status: todo
    comment: "README does not yet contain a troubleshooting section."
  docs-use-cases:
    status: todo
    comment: "README does not yet contain a use-cases section."
  dynamic-devices:
    status: exempt
    comment: "One physical machine per config entry; no dynamic device discovery."
  entity-category: done
  entity-device-class:
    status: todo
    comment: "Audit pending: confirm all sensors that should declare device_class actually do."
  entity-disabled-by-default:
    status: todo
    comment: "Audit pending: identify rarely-used entities that should default to disabled."
  entity-translations: done
  exception-translations:
    status: todo
    comment: "ServiceValidationError messages do not yet use translation_key."
  icon-translations:
    status: todo
    comment: "Optional polish; consider when adding icons for new entities."
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: "No user-actionable repair scenarios identified; device offline is handled by entity unavailability."
  stale-devices:
    status: exempt
    comment: "Single device per entry; no device list to stale-check."

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing:
    status: todo
    comment: "Several files lack full type coverage; mypy strict pass not yet produced."
